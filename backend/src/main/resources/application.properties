
# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.address=0.0.0.0
server.port=8080

# ==========================================
# POSTGRESQL DATABASE
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/carequeue}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ==========================================
# FRONTEND CONFIGURATION
# ==========================================
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# ==========================================
# PUSH NOTIFICATIONS
# ==========================================
carequeue.push.public-key=${VAPID_PUBLIC_KEY:}
carequeue.push.private-key=${VAPID_PRIVATE_KEY:}
carequeue.push.subject=${VAPID_SUBJECT:mailto:admin@carequeue.local}

# ==========================================
# JWT AUTHENTICATION
# ==========================================
carequeue.security.jwt.secret=${JWT_SECRET}
carequeue.security.jwt.expiration=${JWT_EXPIRATION:3600000}

# ==========================================
# FIRST ADMINISTRATOR ACCOUNT
# ==========================================
carequeue.security.admin.email=${ADMIN_EMAIL:}
carequeue.security.admin.password=${ADMIN_PASSWORD:}
carequeue.security.admin.name=${ADMIN_NAME:CareQueue Administrator}

# ==========================================
# REFRESH TOKEN SETTINGS
# ==========================================
carequeue.security.refresh.expiration=604800000
carequeue.security.refresh.cookie-secure=${REFRESH_COOKIE_SECURE:false}

# ==========================================
# GMAIL SMTP CONFIGURATION
# Local development
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# EMAIL PROVIDER
# smtp = Local Gmail
# brevo = Production Brevo API
# ==========================================
app.email.provider=${EMAIL_PROVIDER:smtp}

# ==========================================
# BREVO TRANSACTIONAL EMAIL
# Production deployment
# ==========================================
brevo.api-key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:CareQueue}
